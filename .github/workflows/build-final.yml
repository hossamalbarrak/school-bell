name: Build Final Fixed Bell
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/schoolbell/hossam
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android { compileSdk 34; defaultConfig { applicationId "com.schoolbell.hossam"; minSdk 23; targetSdk 34; versionCode 3; versionName "3.0-fixed" } }
          GRADLE
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.schoolbell.hossam">
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <application android:allowBackup="true" android:icon="@drawable/ic_bell" android:label="جرس المدرسة - حسام" android:theme="@android:style/Theme.Material.Light">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
        </activity>
        <receiver android:name=".AlarmReceiver" android:enabled="true" android:exported="true" />
    </application>
</manifest>
          MAN
          cat > app/src/main/java/com/schoolbell/hossam/MainActivity.java << 'JAVA1'
          
package com.schoolbell.hossam;
import android.app.*; import android.content.*; import android.os.*; import android.widget.*; import android.media.*; import android.provider.Settings; import java.util.Calendar;
public class MainActivity extends Activity {
    AlarmManager am;
    @Override protected void onCreate(Bundle b){
        super.onCreate(b);
        LinearLayout lay = new LinearLayout(this); lay.setOrientation(LinearLayout.VERTICAL); lay.setPadding(40,80,40,40);
        TextView title = new TextView(this); title.setText("🔔 جرس المدرسة - الأستاذ حسام البراك\nيعمل في الخلفية"); title.setTextSize(20); title.setPadding(0,0,0,40);
        lay.addView(title);
        am = (AlarmManager)getSystemService(ALARM_SERVICE);
        // طلب اذن المنبه الدقيق للاندرويد 12+
        if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.S && !am.canScheduleExactAlarms()){
            Toast.makeText(this,"فعل اذن المنبه الدقيق",Toast.LENGTH_LONG).show();
            Intent i = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM); i.setData(android.net.Uri.parse("package:"+getPackageName())); startActivity(i);
        }
        Button testNow = new Button(this); testNow.setText("🔔 جرب الجرس هسه فورا"); lay.addView(testNow);
        Button test1min = new Button(this); test1min.setText("⏰ جرب بعد دقيقة (مضمون)"); lay.addView(test1min);
        Button all = new Button(this); all.setText("✅ فعل كل الاجراس (8 صباحا - 12:10)"); lay.addView(all);
        Button cancel = new Button(this); cancel.setText("❌ الغاء كل الاجراس"); lay.addView(cancel);
        TextView info = new TextView(this); info.setText("\n• الجرس يرن حتى اذا التطبيق مسكر\n• لا تغير وقت الهاتف\n• للتجربة استخدم زر (بعد دقيقة)\n• بعد تفعيل الاجراس لا تمسح التطبيق من الخلفية"); info.setTextSize(14); lay.addView(info);
        ScrollView sv = new ScrollView(this); sv.addView(lay); setContentView(sv);

        testNow.setOnClickListener(v->{ Intent ii=new Intent(this,AlarmReceiver.class); sendBroadcast(ii); Toast.makeText(this,"ارسلت اشارة الجرس",Toast.LENGTH_SHORT).show(); });
        test1min.setOnClickListener(v->{ long t=System.currentTimeMillis()+60000; PendingIntent pi=PendingIntent.getBroadcast(this,9999,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,t,pi); Toast.makeText(this,"راح يدك بعد 60 ثانية - حتى لو قفلت التطبيق",Toast.LENGTH_LONG).show(); });
        all.setOnClickListener(v->{ String[] times={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"}; int c=0; for(String tt:times){ String[] p=tt.split(":"); int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]); Calendar cal=Calendar.getInstance(); cal.set(Calendar.HOUR_OF_DAY,h); cal.set(Calendar.MINUTE,m); cal.set(Calendar.SECOND,0); if(cal.getTimeInMillis()<System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR,1); PendingIntent pi=PendingIntent.getBroadcast(this,c,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,cal.getTimeInMillis(),pi); c++; } Toast.makeText(this,"تم تفعيل "+c+" اجراس - تعمل في الخلفية",Toast.LENGTH_LONG).show(); });
        cancel.setOnClickListener(v->{ for(int i=0;i<10;i++){ PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.cancel(pi);} Toast.makeText(this,"تم الالغاء",Toast.LENGTH_SHORT).show(); });
    }
}

          JAVA1
          cat > app/src/main/java/com/schoolbell/hossam/AlarmReceiver.java << 'JAVA2'
          
package com.schoolbell.hossam;
import android.content.*; import android.media.*; import android.os.*; import android.widget.Toast;
public class AlarmReceiver extends BroadcastReceiver {
    @Override public void onReceive(Context ctx, Intent intent){
        try{ Toast.makeText(ctx,"🔔 جرس المدرسة يدق الآن!",Toast.LENGTH_LONG).show(); }catch(Exception e){}
        try{
            Vibrator vib = (Vibrator)ctx.getSystemService(Context.VIBRATOR_SERVICE);
            if(vib!=null) vib.vibrate(3000);
        }catch(Exception e){}
        MediaPlayer mp=null;
        try{
            mp = MediaPlayer.create(ctx, ctx.getResources().getIdentifier("bell","raw",ctx.getPackageName()));
            if(mp!=null){ mp.setLooping(false); mp.start(); }
            else{
                Ringtone r = RingtoneManager.getRingtone(ctx, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                if(r==null) r=RingtoneManager.getRingtone(ctx,RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION));
                if(r!=null) r.play();
            }
        }catch(Exception e){
            try{ Ringtone r = RingtoneManager.getRingtone(ctx,RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)); if(r!=null) r.play(); }catch(Exception ee){}
        }
    }
}

          JAVA2
          echo '' | base64 -d > app/src/main/res/raw/bell.mp3
          echo '' | base64 -d > app/src/main/res/drawable/ic_bell.png
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'BG'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          BG
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: school-bell-FIXED-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
