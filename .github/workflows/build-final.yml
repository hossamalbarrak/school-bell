name: Build Official - Original Bell
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/schoolbell/hossam
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > build.gradle << 'BG'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          BG
          cat > gradle.properties << 'GP'
          android.useAndroidX=true
          GP
          cat > gradle/wrapper/gradle-wrapper.properties << 'GWP'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          GWP
          cat > app/build.gradle << 'AG'
          plugins { id 'com.android.application' }
          android { compileSdk 34; defaultConfig { applicationId "com.schoolbell.hossam"; minSdk 23; targetSdk 34; versionCode 15; versionName "15.0-original" } }
          dependencies { implementation 'androidx.core:core:1.12.0' }
          AG
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.schoolbell.hossam">
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <application android:allowBackup="true" android:icon="@android:drawable/ic_lock_idle_alarm" android:label="جرس التاجي - حسام" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <receiver android:name=".AlarmReceiver" android:exported="true"/><receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><service android:name=".BellService" android:exported="false"/>
            </application>
          </manifest>
          MAN
          echo 'package com.schoolbell.hossam; import android.app.*; import android.content.*; import android.os.*; import android.widget.*; import android.provider.Settings; import java.util.Calendar; public class MainActivity extends Activity { AlarmManager am; protected void onCreate(Bundle b){ super.onCreate(b); LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setPadding(30,50,30,30); root.setBackgroundColor(0xFFF3E5F5); TextView head=new TextView(this); head.setText("🔔 جرس المدرسة الذكي"); head.setTextSize(24); head.setTextColor(0xFF6A1B9A); root.addView(head); TextView t=new TextView(this); t.setText("تصميم: الأستاذ حسام البراك\nمدرس اللغة العربية\nثانوية التاجي - بغداد"); t.setTextSize(16); root.addView(t); TextView tbl=new TextView(this); tbl.setText("\n📅 الجدول:\n08:00 بداية\n08:45 درس1\n09:30 درس2\n09:50 استراحة\n10:35 درس3\n11:20 درس4\n12:10 نهاية"); tbl.setTextSize(14); tbl.setBackgroundColor(0xFFFFFFFF); tbl.setPadding(10,10,10,10); root.addView(tbl); am=(AlarmManager)getSystemService(ALARM_SERVICE); Button b1=new Button(this); b1.setText("🔔 جرب النغمة الاصلية"); root.addView(b1); Button b2=new Button(this); b2.setText("⏰ جرب بعد دقيقة - خلفية"); root.addView(b2); Button b3=new Button(this); b3.setText("✅ فعل الاجراس + اشعار"); b3.setBackgroundColor(0xFF6A1B9A); b3.setTextColor(0xFFFFFFFF); root.addView(b3); ScrollView sv=new ScrollView(this); sv.addView(root); setContentView(sv); startService(new Intent(this,BellService.class)); b1.setOnClickListener(v-> sendBroadcast(new Intent(this,AlarmReceiver.class))); b2.setOnClickListener(v->{ long t2=System.currentTimeMillis()+60000; PendingIntent pi=PendingIntent.getBroadcast(this,9999,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,t2,pi); Toast.makeText(this,"راح يدك بعد 60 ثانية - اقفل التطبيق",Toast.LENGTH_LONG).show(); }); b3.setOnClickListener(v->{ String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"}; for(int i=0;i<ts.length;i++){ String[] p=ts[i].split(":"); int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]); Calendar ca=Calendar.getInstance(); ca.set(11,h); ca.set(12,m); ca.set(13,0); if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(5,1); PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi);} Toast.makeText(this,"تم تفعيل 7 اجراس",Toast.LENGTH_LONG).show(); }); } }' > app/src/main/java/com/schoolbell/hossam/MainActivity.java
          echo 'package com.schoolbell.hossam; import android.content.*; import android.media.*; import android.os.*; import android.widget.Toast; public class AlarmReceiver extends BroadcastReceiver{ public void onReceive(Context ctx, Intent i){ try{ Toast.makeText(ctx,"🔔 جرس التاجي!",Toast.LENGTH_LONG).show(); }catch(Exception e){} try{ Vibrator v=(Vibrator)ctx.getSystemService(Context.VIBRATOR_SERVICE); if(v!=null) v.vibrate(4000);}catch(Exception e){} try{ int id=ctx.getResources().getIdentifier("bell","raw",ctx.getPackageName()); MediaPlayer mp=null; if(id!=0) mp=MediaPlayer.create(ctx,id); if(mp!=null){ mp.start(); } else { Ringtone r=RingtoneManager.getRingtone(ctx,RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)); if(r!=null) r.play(); } }catch(Exception e){} } }' > app/src/main/java/com/schoolbell/hossam/AlarmReceiver.java
          echo 'package com.schoolbell.hossam; import android.app.*; import android.content.*; import android.os.*; import androidx.core.app.NotificationCompat; public class BellService extends Service{ public int onStartCommand(Intent i,int f,int s){ NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE); if(Build.VERSION.SDK_INT>=26){ NotificationChannel ch=new NotificationChannel("svc","خدمة",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch);} NotificationCompat.Builder b=new NotificationCompat.Builder(this,"svc").setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle("جرس التاجي يعمل").setContentText("حسام البراك - يعمل في الخلفية").setOngoing(true); startForeground(1,b.build()); return START_STICKY;} public IBinder onBind(Intent i){return null;}}' > app/src/main/java/com/schoolbell/hossam/BellService.java
          echo 'package com.schoolbell.hossam; import android.content.*; import android.app.*; import java.util.Calendar; public class BootReceiver extends BroadcastReceiver{ public void onReceive(Context c, Intent i){ if(Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())){ AlarmManager am=(AlarmManager)c.getSystemService(Context.ALARM_SERVICE); String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"}; for(int j=0;j<ts.length;j++){ String[] p=ts[j].split(":"); int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]); Calendar ca=Calendar.getInstance(); ca.set(11,h); ca.set(12,m); ca.set(13,0); if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(5,1); PendingIntent pi=PendingIntent.getBroadcast(c,j,new Intent(c,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi); } } } }' > app/src/main/java/com/schoolbell/hossam/BootReceiver.java
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Download original bell sound from public URL (original bell)
          curl -L -o app/src/main/res/raw/bell.mp3 https://cdn.freesound.org/previews/254/254316_4062622-lq.mp3 || echo "download failed, will use system sound"
          # If download fails, create empty file so build does not fail
          ls -lh app/src/main/res/raw/
          cat > gradlew << 'GW'
          #!/bin/sh
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          java -jar gradle/wrapper/gradle-wrapper.jar "$@"
          GW
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jaras-Taji-Original
          path: app/build/outputs/apk/debug/app-debug.apk
