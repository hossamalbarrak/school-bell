name: Build Complete Final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Full App
        run: |
          mkdir -p app/src/main/java/com/schoolbell/hossam
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > build.gradle << 'BG'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          BG
          cat > gradle.properties << 'GP'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx2048m
          GP
          cat > gradle/wrapper/gradle-wrapper.properties << 'GWP'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          GWP
          cat > app/build.gradle << 'AG'
          plugins { id 'com.android.application' }
          android {
            compileSdk 34
            defaultConfig { applicationId "com.schoolbell.hossam"; minSdk 23; targetSdk 34; versionCode 10; versionName "10.0-complete" }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.core:core:1.12.0' }
          AG
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.schoolbell.hossam">
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <application android:allowBackup="true" android:icon="@drawable/ic_bell" android:label="جرس المدرسة - التاجي" android:theme="@android:style/Theme.Material.Light">
        <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
        <receiver android:name=".AlarmReceiver" android:enabled="true" android:exported="true"/>
        <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>
        <service android:name=".BellService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
    </application>
</manifest>
          MAN
          cat > app/src/main/java/com/schoolbell/hossam/MainActivity.java << 'J1'
          package com.schoolbell.hossam;
import android.app.*; import android.content.*; import android.os.*; import android.widget.*; import android.provider.Settings; import java.util.Calendar;
public class MainActivity extends Activity {
    AlarmManager am;
    @Override protected void onCreate(Bundle b){
        super.onCreate(b);
        LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(30,50,30,30); root.setBackgroundColor(0xFFF3E5F5);
        TextView head=new TextView(this); head.setText("🔔 جرس المدرسة الذكي"); head.setTextSize(26); head.setTextColor(0xFF6A1B9A); head.setPadding(0,0,0,10); root.addView(head);
        TextView teacher=new TextView(this); teacher.setText("تصميم: الأستاذ حسام البراك\nمدرس اللغة العربية\nثانوية التاجي - بغداد"); teacher.setTextSize(16); teacher.setTextColor(0xFF4A148C); teacher.setPadding(0,0,0,20); root.addView(teacher);
        TextView tableTitle=new TextView(this); tableTitle.setText("📅 جدول الدروس الرسمي:"); tableTitle.setTextSize(18); tableTitle.setTextColor(0xFF6A1B9A); root.addView(tableTitle);
        String times="08:00 - 08:45  الدرس الأول\n08:45 - 09:30  الدرس الثاني\n09:30 - 09:50  استراحة\n09:50 - 10:35  الدرس الثالث\n10:35 - 11:20  الدرس الرابع\n11:20 - 12:10  الدرس الخامس (أخير)";
        TextView table=new TextView(this); table.setText(times); table.setTextSize(14); table.setPadding(10,10,10,20); table.setBackgroundColor(0xFFFFFFFF); root.addView(table);
        am=(AlarmManager)getSystemService(ALARM_SERVICE);
        if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.S && !am.canScheduleExactAlarms()){
            Toast.makeText(this,"فعل اذن المنبه الدقيق",Toast.LENGTH_LONG).show();
            Intent i=new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM); i.setData(android.net.Uri.parse("package:"+getPackageName())); startActivity(i);
        }
        Button testNow=new Button(this); testNow.setText("🔔 جرب النغمة الاصلية هسه"); root.addView(testNow);
        Button test1min=new Button(this); test1min.setText("⏰ جرب بعد دقيقة (خلفية)"); root.addView(test1min);
        Button all=new Button(this); all.setText("✅ فعل الجرس - يعمل بالخلفية"); all.setBackgroundColor(0xFF6A1B9A); all.setTextColor(0xFFFFFFFF); root.addView(all);
        Button stop=new Button(this); stop.setText("❌ ايقاف الجرس والاشعار"); root.addView(stop);
        TextView info=new TextView(this); info.setText("\n✓ يشتغل حتى اذا طلعت من التطبيق\n✓ اشعار ثابت يبقيه شغال\n✓ لا تغير ساعة الهاتف"); info.setTextSize(13); root.addView(info);
        ScrollView sv=new ScrollView(this); sv.addView(root); setContentView(sv);
        // Start foreground service for background
        Intent svc=new Intent(this,BellService.class); if(Build.VERSION.SDK_INT>=26) startForegroundService(svc); else startService(svc);
        testNow.setOnClickListener(v->{ sendBroadcast(new Intent(this,AlarmReceiver.class)); });
        test1min.setOnClickListener(v->{ long t=System.currentTimeMillis()+60000; PendingIntent pi=PendingIntent.getBroadcast(this,9999,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,t,pi); Toast.makeText(this,"راح يدك بعد 60 ثانية - اقفل التطبيق",Toast.LENGTH_LONG).show(); });
        all.setOnClickListener(v->{ String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"}; for(int i=0;i<ts.length;i++){ String[] p=ts[i].split(":"); int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]); Calendar ca=Calendar.getInstance(); ca.set(11,h); ca.set(12,m); ca.set(13,0); ca.set(14,0); if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(5,1); PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi); } Toast.makeText(this,"تم تفعيل 7 اجراس + اشعار خلفية",Toast.LENGTH_LONG).show(); });
        stop.setOnClickListener(v->{ for(int i=0;i<20;i++){ PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.cancel(pi);} stopService(new Intent(this,BellService.class)); Toast.makeText(this,"تم الايقاف",Toast.LENGTH_SHORT).show(); });
    }
}

          J1
          cat > app/src/main/java/com/schoolbell/hossam/AlarmReceiver.java << 'J2'
          package com.schoolbell.hossam;
import android.content.*; import android.media.*; import android.os.*; import android.widget.Toast;
import androidx.core.app.NotificationCompat; import android.app.*;
public class AlarmReceiver extends BroadcastReceiver{
    @Override public void onReceive(Context ctx, Intent intent){
        try{ Toast.makeText(ctx,"🔔 جرس المدرسة - حان وقت الدرس!",Toast.LENGTH_LONG).show(); }catch(Exception e){}
        try{ Vibrator v=(Vibrator)ctx.getSystemService(Context.VIBRATOR_SERVICE); if(v!=null) v.vibrate(new long[]{0,1000,500,1000},-1); }catch(Exception e){}
        // Sound
        try{
            int res=ctx.getResources().getIdentifier("bell","raw",ctx.getPackageName());
            MediaPlayer mp=null;
            if(res!=0){ mp=MediaPlayer.create(ctx,res); } 
            if(mp!=null){ mp.start(); }
            else{
                Ringtone r=RingtoneManager.getRingtone(ctx,RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                if(r!=null) r.play();
            }
        }catch(Exception e){}
        // Notification
        try{
            NotificationManager nm=(NotificationManager)ctx.getSystemService(Context.NOTIFICATION_SERVICE);
            if(Build.VERSION.SDK_INT>=26){ NotificationChannel ch=new NotificationChannel("bell_channel","جرس المدرسة",NotificationManager.IMPORTANCE_HIGH); ch.enableVibration(true); nm.createNotificationChannel(ch); }
            NotificationCompat.Builder nb=new NotificationCompat.Builder(ctx,"bell_channel").setSmallIcon(ctx.getResources().getIdentifier("ic_bell","drawable",ctx.getPackageName())).setContentTitle("🔔 جرس المدرسة").setContentText("حان وقت الدرس - ثانوية التاجي").setPriority(NotificationCompat.PRIORITY_MAX).setAutoCancel(true);
            nm.notify((int)System.currentTimeMillis(),nb.build());
        }catch(Exception e){}
    }
}

          J2
          cat > app/src/main/java/com/schoolbell/hossam/BellService.java << 'J3'
          package com.schoolbell.hossam;
import android.app.*; import android.content.*; import android.os.*; import androidx.core.app.NotificationCompat;
public class BellService extends Service{
    @Override public int onStartCommand(Intent intent,int flags,int startId){
        NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
        if(Build.VERSION.SDK_INT>=26){ NotificationChannel ch=new NotificationChannel("service_channel","خدمة الجرس",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch); }
        NotificationCompat.Builder b=new NotificationCompat.Builder(this,"service_channel").setSmallIcon(getResources().getIdentifier("ic_bell","drawable",getPackageName())).setContentTitle("جرس المدرسة يعمل").setContentText("ثانوية التاجي - الأستاذ حسام البراك - يعمل في الخلفية").setOngoing(true);
        startForeground(1,b.build());
        return START_STICKY;
    }
    @Override public IBinder onBind(Intent i){ return null; }
}

          J3
          cat > app/src/main/java/com/schoolbell/hossam/BootReceiver.java << 'J4'
          package com.schoolbell.hossam;
import android.content.*; import android.app.*; import java.util.Calendar;
public class BootReceiver extends BroadcastReceiver{
    @Override public void onReceive(Context ctx, Intent intent){
        if(Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())){
            AlarmManager am=(AlarmManager)ctx.getSystemService(Context.ALARM_SERVICE);
            String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"};
            for(int i=0;i<ts.length;i++){
                String[] p=ts[i].split(":");
                int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]);
                Calendar ca=Calendar.getInstance(); ca.set(11,h); ca.set(12,m); ca.set(13,0);
                if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(5,1);
                PendingIntent pi=PendingIntent.getBroadcast(ctx,i,new Intent(ctx,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
                am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi);
            }
        }
    }
}

          J4
          echo '' | base64 -d > app/src/main/res/raw/bell.mp3
          echo '' | base64 -d > app/src/main/res/drawable/ic_bell.png
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # create gradlew
          cat > gradlew << 'GW'
          #!/usr/bin/env sh
          set -e
          GRADLE_WRAPPER_JAR=""
          for f in gradle/wrapper/gradle-wrapper.jar; do if [ -f "$f" ]; then GRADLE_WRAPPER_JAR="$f"; fi; done
          if [ ! -f "$GRADLE_WRAPPER_JAR" ]; then
            echo "Downloading gradle wrapper jar..."
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
            GRADLE_WRAPPER_JAR=gradle/wrapper/gradle-wrapper.jar
          fi
          exec java -jar "$GRADLE_WRAPPER_JAR" "$@"
          GW
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jaras-AlTaji-Complete-Final
          path: app/build/outputs/apk/debug/app-debug.apk
