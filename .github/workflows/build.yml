name: Build School Bell APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build APK
        run: |
          set -e
          unzip -o schoolbell-ready-assets.zip
          mkdir -p app/src/main/java/com/schoolbell/hossam app/src/main/res
          cp -a schoolbell-ready/app/src/main/res/. app/src/main/res/
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'END'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SchoolBell'
          include ':app'
          END

          cat > build.gradle << 'END'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          END

          cat > gradle.properties << 'END'
          android.useAndroidX=true
          END

          cat > app/build.gradle << 'END'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.schoolbell.hossam'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.schoolbell.hossam'
                  minSdk 23
                  targetSdk 34
                  versionCode 21
                  versionName '21.0'
              }
          }
          dependencies { implementation 'androidx.core:core:1.12.0' }
          END

          cat > app/src/main/AndroidManifest.xml << 'END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.schoolbell.hossam">
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="جرس المدرسة" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".AlarmReceiver" android:exported="true" />
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
              <service android:name=".BellService" android:exported="false" android:foregroundServiceType="specialUse">
                <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="تشغيل خدمة جرس المدرسة المجدولة وإظهار إشعار دائم بحالة التشغيل" />
              </service>
            </application>
          </manifest>
          END

          cat > app/src/main/java/com/schoolbell/hossam/MainActivity.java << 'END'
          package com.schoolbell.hossam;
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.os.*;
          import android.widget.*;
          import java.util.Calendar;
          public class MainActivity extends Activity {
              AlarmManager am;
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setPadding(30,50,30,30); root.setBackgroundColor(0xFFF3E5F5);
                  TextView head=new TextView(this); head.setText("🔔 جرس المدرسة الذكي"); head.setTextSize(24); head.setTextColor(0xFF6A1B9A); root.addView(head);
                  TextView info=new TextView(this); info.setText("تصميم: الأستاذ حسام البراك\nمدرس اللغة العربية\nثانوية التاجي - بغداد"); info.setTextSize(16); info.setTextColor(0xFF4A148C); root.addView(info);
                  TextView tbl=new TextView(this); tbl.setText("\n📅 الجدول:\n08:00 بداية\n08:45 درس1\n09:30 درس2\n09:50 استراحة\n10:35 درس3\n11:20 درس4\n12:10 نهاية"); tbl.setBackgroundColor(0xFFFFFFFF); tbl.setPadding(10,10,10,10); root.addView(tbl);
                  am=(AlarmManager)getSystemService(ALARM_SERVICE);
                  Button b1=new Button(this); b1.setText("🔔 جرب النغمة الاصلية"); root.addView(b1);
                  Button b2=new Button(this); b2.setText("⏰ جرب بعد دقيقة - بالخلفية + الشاشة مطفية"); root.addView(b2);
                  Button b3=new Button(this); b3.setText("✅ فعل الاجراس + اشعار خلفية"); b3.setBackgroundColor(0xFF6A1B9A); b3.setTextColor(0xFFFFFFFF); root.addView(b3);
                  Button b4=new Button(this); b4.setText("❌ ايقاف"); root.addView(b4);
                  ScrollView sv=new ScrollView(this); sv.addView(root); setContentView(sv);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},100);
                  startBellService();
                  b1.setOnClickListener(v-> sendBroadcast(new Intent(this,AlarmReceiver.class)));
                  b2.setOnClickListener(v->{ long t2=System.currentTimeMillis()+60000; PendingIntent pi=PendingIntent.getBroadcast(this,9999,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,t2,pi); Toast.makeText(this,"راح يدك بعد 60 ثانية - اقفل الشاشة وجرب",Toast.LENGTH_LONG).show(); });
                  b3.setOnClickListener(v->{ String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"}; for(int i=0;i<ts.length;i++){ String[] p=ts[i].split(":"); int h=Integer.parseInt(p[0]); int m=Integer.parseInt(p[1]); Calendar ca=Calendar.getInstance(); ca.set(Calendar.HOUR_OF_DAY,h); ca.set(Calendar.MINUTE,m); ca.set(Calendar.SECOND,0); if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(Calendar.DAY_OF_YEAR,1); PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi);} startBellService(); Toast.makeText(this,"تم تفعيل 7 اجراس - تعمل حتى مع قفل الشاشة",Toast.LENGTH_LONG).show(); });
                  b4.setOnClickListener(v->{ for(int i=0;i<20;i++){ PendingIntent pi=PendingIntent.getBroadcast(this,i,new Intent(this,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.cancel(pi);} stopService(new Intent(this,BellService.class)); Toast.makeText(this,"تم الايقاف",Toast.LENGTH_SHORT).show(); });
              }
              private void startBellService() { Intent si=new Intent(this,BellService.class); if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O) startForegroundService(si); else startService(si); }
          }
          END

          cat > app/src/main/java/com/schoolbell/hossam/AlarmReceiver.java << 'END'
          package com.schoolbell.hossam;
          import android.app.*;
          import android.content.*;
          import android.media.*;
          import android.os.*;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;
          public class AlarmReceiver extends BroadcastReceiver {
              public void onReceive(Context ctx, Intent intent) {
                  try { Toast.makeText(ctx,"🔔 جرس التاجي يدق!",Toast.LENGTH_LONG).show(); } catch(Exception e) {}
                  try { Vibrator v=(Vibrator)ctx.getSystemService(Context.VIBRATOR_SERVICE); if(v!=null) v.vibrate(4000); } catch(Exception e) {}
                  try { MediaPlayer mp=MediaPlayer.create(ctx,R.raw.bell); if(mp!=null) { mp.setOnCompletionListener(MediaPlayer::release); mp.start(); } } catch(Exception e) {}
                  try {
                      NotificationManager nm=(NotificationManager)ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if(Build.VERSION.SDK_INT>=26) nm.createNotificationChannel(new NotificationChannel("bell_ch","جرس المدرسة",NotificationManager.IMPORTANCE_HIGH));
                      NotificationCompat.Builder nb=new NotificationCompat.Builder(ctx,"bell_ch").setSmallIcon(R.mipmap.ic_launcher).setContentTitle("🔔 جرس المدرسة").setContentText("حان وقت الدرس - ثانوية التاجي - حسام البراك").setPriority(NotificationCompat.PRIORITY_MAX).setAutoCancel(true);
                      nm.notify((int)(System.currentTimeMillis()&0x7fffffff),nb.build());
                  } catch(Exception e) {}
              }
          }
          END

          cat > app/src/main/java/com/schoolbell/hossam/BellService.java << 'END'
          package com.schoolbell.hossam;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import androidx.core.app.NotificationCompat;
          public class BellService extends Service {
              public int onStartCommand(Intent i,int f,int s) {
                  NotificationManager nm=(NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);
                  if(Build.VERSION.SDK_INT>=26) nm.createNotificationChannel(new NotificationChannel("svc","حالة جرس المدرسة",NotificationManager.IMPORTANCE_LOW));
                  Notification n=new NotificationCompat.Builder(this,"svc").setSmallIcon(R.mipmap.ic_launcher).setContentTitle("جرس المدرسة يعمل").setContentText("الأجراس مفعّلة وتعمل في الخلفية").setOngoing(true).build();
                  if(Build.VERSION.SDK_INT>=34) startForeground(1,n,android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE); else startForeground(1,n);
                  return START_STICKY;
              }
              public IBinder onBind(Intent i) { return null; }
          }
          END

          cat > app/src/main/java/com/schoolbell/hossam/BootReceiver.java << 'END'
          package com.schoolbell.hossam;
          import android.app.*;
          import android.content.*;
          import android.os.Build;
          import java.util.Calendar;
          public class BootReceiver extends BroadcastReceiver {
              public void onReceive(Context c,Intent i) {
                  if(Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) {
                      AlarmManager am=(AlarmManager)c.getSystemService(Context.ALARM_SERVICE);
                      String[] ts={"08:00","08:45","09:30","09:50","10:35","11:20","12:10"};
                      for(int j=0;j<ts.length;j++) { String[] p=ts[j].split(":"); int h=Integer.parseInt(p[0]),m=Integer.parseInt(p[1]); Calendar ca=Calendar.getInstance(); ca.set(Calendar.HOUR_OF_DAY,h); ca.set(Calendar.MINUTE,m); ca.set(Calendar.SECOND,0); if(ca.getTimeInMillis()<=System.currentTimeMillis()) ca.add(Calendar.DAY_OF_YEAR,1); PendingIntent pi=PendingIntent.getBroadcast(c,j,new Intent(c,AlarmReceiver.class),PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,ca.getTimeInMillis(),pi); }
                      Intent service=new Intent(c,BellService.class); if(Build.VERSION.SDK_INT>=26) c.startForegroundService(service); else c.startService(service);
                  }
              }
          }
          END

          gradle wrapper --gradle-version 8.2 --distribution-type bin
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jaras-Taji-FINAL-GREEN-ORIGINAL
          path: app/build/outputs/apk/debug/app-debug.apk
